name: build
on:
  workflow_dispatch:
  push:
jobs:
  build:
    if: ${{ !startsWith(github.ref_name, 'jar') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # MeslekAPI için Meslek-Sistemi derlenip yerel Maven deposuna kurulur
      - uses: actions/checkout@v4
        with:
          repository: coderen34-ops/Meslek-Sistemi
          path: meslek-sistemi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B -f meslek-sistemi/pom.xml install
      - run: mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: klan-sistemi
          path: target/*.jar
      - name: Jar'i jar-claude dalina koy
        run: |
          mkdir -p /tmp/out && cp target/*.jar /tmp/out/
          git config user.name github-actions
          git config user.email actions@github.com
          git checkout --orphan jar-claude
          git rm -rf . -q
          cp /tmp/out/*.jar .
          git add -A
          git commit -q -m "derlenmis jar"
          git push -f origin jar-claude
