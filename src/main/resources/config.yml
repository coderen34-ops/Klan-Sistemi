# ================================================================
#  KLAN SİSTEMİ AYARLARI
#  Tüm süreler: saat/gün/dakika cinsinden ondalıklı yazılabilir.
#  Değişiklikten sonra: /klan admin yenile
# ================================================================

klan:
  kurma-ucreti: 50000            # Banka hesabından çekilir
  max-uye: 10
  isim-min: 3
  isim-max: 16
  ayrilma-bekleme-saat: 24       # Klandan ayrılan/atılan bu süre başka klana giremez
  yeni-klan-savas-koruma-saat: 24
  davet-gecerlilik-dakika: 5

kasa:
  ust-sinir: 10000000            # Yatırma ile aşılamaz (aidat ödemeleri hariç)
  yardimci-gunluk-cekim-limiti: 20000
  esya-sayfa-sayisi: 3           # Eşya kasası sayfası (sayfa başına 45 slot; alt satır butonlar)
  yardimci-gunluk-esya-limiti: 128   # Yardımcının kasadan günde alabileceği eşya adedi

iliski:
  dost-pvp-engeli: true          # Müttefik klanlar birbirine PvP hasarı veremez
  gorus-bekleme-saat: 1          # Aynı klan hakkındaki görüşü değiştirme beklemesi
  dostluk-husumet-bekleme-saat: 12   # Dostluk bozulduktan sonra husumet ilanı için bekleme
  not-max-karakter: 100

aidat:
  aktif: true
  miktar: 1000                   # Yeni klanların varsayılan aidatı
  min-miktar: 1000               # Liderin ayarlayabileceği aralık
  max-miktar: 50000
  periyot-gun: 7
  ek-sure-gun: 2
  lider-muaf: true
  yeni-uye-muaf-gun: 7           # Katıldığı dönem her zaman muaftır; bu süre daha uzunsa sonraki dönemler de
  otomatik-atma: true
  otomatik-atma-donem: 3         # Üst üste bu kadar dönem ödemeyen atılır
  lider-bildirim-donem: 2       # Üst üste bu kadar dönem ödemeyen için lidere bildirim
  cevrimdisi-koruma: true        # Ek süre bittiğinde oyunda olmayanın ek süresi girişte yeniden başlar

savas:
  # Açık dünyada öldürme savaşı bu sürümde yok; tüm savaşlar arena düellosu olarak yapılır.
  acik-dunya-savasi: false
  teklif-gecerlilik-dakika: 10
  min-cevrimici: 3               # Kabul için her klanda en az bu kadar çevrimiçi üye
  min-katilimci: 3               # Geri sayım bitince her klandan en az bu kadar katılımcı (yoksa iptal)
  max-katilimci: 5
  geri-sayim-saniye: 60
  hedef-puan: 15
  sure-dakika: 15
  yeniden-dogma-saniye: 5        # Ölen oyuncu kendi spawn'ında bu süre korumalı bekler
  ayni-oyuncu-puan-bekleme-saniye: 5
  cikis-tolerans-saniye: 60      # Oyundan çıkan katılımcı bu sürede dönmezse düşer, rakibe +1
  esya-kaybi: false              # false: ölünce eşya düşmez. true: eşyalar düşer, kazanan toplar
  klan-ici-hasar: false          # Aynı klan üyeleri arenada birbirine hasar verebilir mi
  ganimet-min: 25                # Kazanan, kaybedenin kasasından %min-%max alır (puan farkına göre)
  ganimet-max: 50
  kaybeden-bekleme-saat: 6
  ayni-klanlar-bekleme-saat: 12
  # Savaştaki oyuncunun kullanamayacağı komutlar ("eklenti:komut" yazımı da engellenir)
  yasak-komutlar: [tpa, tpahere, tpaccept, tpyes, home, homes, spawn, warp, warps, back, rtp, wild, tp, tphere, call, ehome, espawn, ewarp, eback]

prestij:
  # Husumetli bir klanın üyesini açık dünyada ağır yaralamak (Meslek sağlık sistemi) klanına prestij kazandırır.
  # Para/kasa transferi yoktur; sıralama: /klan prestij
  aktif: true
  puan: 1
  ayni-kurban-bekleme-dakika: 30   # Aynı oyuncu bu süre içinde tekrar prestij kazandırmaz
  yeni-uye-koruma-saat: 24         # Klanına yeni katılan oyuncu bu süre prestij kazandırmaz
  # Güvenli bölgelerde prestij verilmez:
  claimler-guvenli: true           # GriefPrevention claim'lerinin içi (evler, arsalar, admin claim'leri)
  merkez-cap: 400                  # Köy merkezi çevresi (blok çapı). Merkez: /klan admin guvenli merkez
  # Ek bölgeler: /klan admin guvenli kur|pos1|pos2 <isim>. Arenalar da güvenli sayılır.

# ================================================================
#  BÜYÜ UZMANLIĞI
#  Bir alanı aynı anda tek klan yönetir. Büyü adları Minecraft adlarıdır (efficiency, fortune, sharpness...).
#  klan: kasa-bağlı klan katmanı seviyeleri | ticari: dışarıya satılan katman seviyeleri
#  Pilot: sadece KAZMA açık. Diğer alanlar hazır, "aktif: true" yapılınca açılır.
# ================================================================
buyu:
  uzmanlik:
    alma-ucreti: 100000          # Klan kasasından alınır
    klan-basina-max-alan: 1
  alanlar:
    KAZMA:
      aktif: true
      ad: '&bKazma Ustalığı'
      esyalar: [IRON_PICKAXE, DIAMOND_PICKAXE, NETHERITE_PICKAXE]
      klan:
        efficiency: 7
        fortune: 4               # Ekonomi için 4 önerilir (elmas/zümrüt Belediye borsasına satılabiliyor)
        unbreaking: 5
      ticari:
        efficiency: 5
        fortune: 3
        unbreaking: 3
    KILIC:
      aktif: false
      ad: '&cKılıç Ustalığı'
      esyalar: [IRON_SWORD, DIAMOND_SWORD, NETHERITE_SWORD]
      klan:
        sharpness: 7
        looting: 4
        unbreaking: 5
      ticari:
        sharpness: 5
        looting: 3
        unbreaking: 3
    ZIRH:
      aktif: false
      ad: '&9Zırh Ustalığı'
      esyalar: [IRON_HELMET, IRON_CHESTPLATE, IRON_LEGGINGS, IRON_BOOTS, DIAMOND_HELMET, DIAMOND_CHESTPLATE, DIAMOND_LEGGINGS, DIAMOND_BOOTS, NETHERITE_HELMET, NETHERITE_CHESTPLATE, NETHERITE_LEGGINGS, NETHERITE_BOOTS]
      klan:
        protection: 6
        unbreaking: 5
      ticari:
        protection: 4
        unbreaking: 3
    BALTA_KUREK:
      aktif: false
      ad: '&aBalta ve Kürek Ustalığı'
      esyalar: [IRON_AXE, DIAMOND_AXE, NETHERITE_AXE, IRON_SHOVEL, DIAMOND_SHOVEL, NETHERITE_SHOVEL]
      klan:
        efficiency: 7
        unbreaking: 5
      ticari:
        efficiency: 5
        unbreaking: 3
    YAY:
      aktif: false
      ad: '&eYay Ustalığı'
      esyalar: [BOW, CROSSBOW]
      klan:
        power: 7
        unbreaking: 5
        quick_charge: 4
      ticari:
        power: 5
        unbreaking: 3
        quick_charge: 3

# PlaceholderAPI (kuruluysa): %klan_isim% %klan_rol% %klan_uye% %klan_prestij% %klan_sira%
placeholder:
  klansiz: ''                    # Klanı olmayan oyuncu için gösterilecek metin (örn. 'Klansız')

# Tag-Manager (TagPlugin) entegrasyonu: klan etiketi meslek etiketinin ÖNÜNE eklenir,
# mevcut önek/sonek bozulmaz. Yer tutucular: {klan}, {rol}
etiket:
  aktif: true
  format: '&8[&6{klan}&8]'

# Klan adlarında geçemeyecek kelimeler (büyük/küçük harf ve Türkçe karakter farkı gözetilmez)
# Not: Kelime klan adının herhangi bir yerinde geçerse engellenir; çok kısa kelimeler masum isimleri
# de engelleyebilir (örn. "sik" -> "Işık"). Listeyi sunucunuza göre düzenleyin.
yasakli-kelimeler:
  - amk
  - orospu
  - siktir
  - yarrak
  - ibne
  - pezevenk
  - gavat
  - discord
  - http
  - www

