# ================================================================
#  AİLE SİSTEMİ AYARLARI
#  Tüm süreler: saat/gün/dakika cinsinden ondalıklı yazılabilir.
#  Değişiklikten sonra: /aile admin yenile
# ================================================================

aile:
  kurma-ucreti: 50000            # Banka hesabından çekilir
  max-uye: 10
  isim-min: 3
  isim-max: 16
  ayrilma-bekleme-saat: 24       # Aileden ayrılan/atılan bu süre başka aileye giremez
  yeni-aile-savas-koruma-saat: 24
  davet-gecerlilik-dakika: 5

kasa:
  ust-sinir: 10000000            # Yatırma ile aşılamaz (aidat ödemeleri hariç)
  yardimci-gunluk-cekim-limiti: 20000
  esya-sayfa-sayisi: 3           # Eşya kasası sayfası (sayfa başına 45 slot; alt satır butonlar)
  yardimci-gunluk-esya-limiti: 128   # Yardımcının kasadan günde alabileceği eşya adedi

iliski:
  dost-pvp-engeli: true          # Müttefik aileler birbirine PvP hasarı veremez
  gorus-bekleme-saat: 1          # Aynı aile hakkındaki görüşü değiştirme beklemesi
  dostluk-husumet-bekleme-saat: 12   # Dostluk bozulduktan sonra husumet ilanı için bekleme
  not-max-karakter: 100

aidat:
  aktif: true
  miktar: 5000                   # Yeni ailelerin varsayılan aidatı
  min-miktar: 1000               # Patronun ayarlayabileceği aralık
  max-miktar: 50000
  periyot-gun: 7
  ek-sure-gun: 2
  patron-muaf: true
  yeni-uye-muaf-gun: 7           # Katıldığı dönem her zaman muaftır; bu süre daha uzunsa sonraki dönemler de
  otomatik-atma: true
  otomatik-atma-donem: 3         # Üst üste bu kadar dönem ödemeyen atılır
  patron-bildirim-donem: 2       # Üst üste bu kadar dönem ödemeyen için patrona bildirim
  cevrimdisi-koruma: true        # Ek süre bittiğinde oyunda olmayanın ek süresi girişte yeniden başlar

savas:
  # Açık dünyada öldürme savaşı bu sürümde yok; tüm savaşlar arena düellosu olarak yapılır.
  acik-dunya-savasi: false
  teklif-gecerlilik-dakika: 10
  min-cevrimici: 3               # Kabul için her ailede en az bu kadar çevrimiçi üye
  min-katilimci: 3               # Geri sayım bitince her aileden en az bu kadar katılımcı (yoksa iptal)
  max-katilimci: 5
  geri-sayim-saniye: 60
  hedef-puan: 15
  sure-dakika: 15
  yeniden-dogma-saniye: 5        # Ölen oyuncu kendi spawn'ında bu süre korumalı bekler
  ayni-oyuncu-puan-bekleme-saniye: 5
  cikis-tolerans-saniye: 60      # Oyundan çıkan katılımcı bu sürede dönmezse düşer, rakibe +1
  esya-kaybi: false              # false: ölünce eşya düşmez. true: eşyalar düşer, kazanan toplar
  aile-ici-hasar: false          # Aynı aile üyeleri arenada birbirine hasar verebilir mi
  ganimet-min: 25                # Kazanan, kaybedenin kasasından %min-%max alır (puan farkına göre)
  ganimet-max: 50
  kaybeden-bekleme-saat: 6
  ayni-aileler-bekleme-saat: 12
  # Savaştaki oyuncunun kullanamayacağı komutlar ("eklenti:komut" yazımı da engellenir)
  yasak-komutlar: [tpa, tpahere, tpaccept, tpyes, home, homes, spawn, warp, warps, back, rtp, wild, tp, tphere, call, ehome, espawn, ewarp, eback]

prestij:
  # Husumetli bir ailenin üyesini açık dünyada ağır yaralamak (Meslek sağlık sistemi) ailene prestij kazandırır.
  # Para/kasa transferi yoktur; sıralama: /aile prestij
  aktif: true
  puan: 1
  ayni-kurban-bekleme-dakika: 30   # Aynı oyuncu bu süre içinde tekrar prestij kazandırmaz
  yeni-uye-koruma-saat: 24         # Ailesine yeni katılan oyuncu bu süre prestij kazandırmaz
  # Güvenli bölgelerde prestij verilmez:
  claimler-guvenli: true           # GriefPrevention claim'lerinin içi (evler, arsalar, admin claim'leri)
  merkez-cap: 400                  # Köy merkezi çevresi (blok çapı). Merkez: /aile admin guvenli merkez
  # Ek bölgeler: /aile admin guvenli kur|pos1|pos2 <isim>. Arenalar da güvenli sayılır.

# Tag-Manager (TagPlugin) entegrasyonu: aile etiketi meslek etiketinin ÖNÜNE eklenir,
# mevcut önek/sonek bozulmaz. Yer tutucular: {aile}, {rol}
etiket:
  aktif: true
  format: '&8[&6{aile}&8]'

# Aile adlarında geçemeyecek kelimeler (büyük/küçük harf ve Türkçe karakter farkı gözetilmez)
# Not: Kelime aile adının herhangi bir yerinde geçerse engellenir; çok kısa kelimeler masum isimleri
# de engelleyebilir (örn. "sik" -> "Işık"). Listeyi sunucunuza göre düzenleyin.
yasakli-kelimeler:
  - amk
  - orospu
  - siktir
  - yarrak
  - ibne
  - pezevenk
  - gavat
  - discord
  - http
  - www

